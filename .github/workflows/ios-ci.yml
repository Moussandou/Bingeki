name: iOS CI Validation

on:
  push:
    branches:
      - main
      - 'feature/ios*'
    paths:
      - 'Bingeki-iOS/**'
      - '.github/workflows/ios-ci.yml'
  pull_request:
    branches:
      - main
      - 'feature/ios*'
    paths:
      - 'Bingeki-iOS/**'
      - '.github/workflows/ios-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-tests:
    name: iOS Unit & UI Tests
    runs-on: macos-15
    defaults:
      run:
        working-directory: Bingeki-iOS
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Cache Homebrew Formulas
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /opt/homebrew/Cellar/xcodegen
          key: ${{ runner.os }}-brew-xcodegen-${{ hashFiles('Bingeki-iOS/project.yml') }}
          restore-keys: |
            ${{ runner.os }}-brew-xcodegen-

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &>/dev/null; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Cache SPM Packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('Bingeki-iOS/project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve SPM Dependencies
        run: xcodebuild -resolvePackageDependencies -project Bingeki.xcodeproj -scheme Bingeki

      - name: Run Unit Tests
        run: |
          xcodebuild test \
            -project Bingeki.xcodeproj \
            -scheme Bingeki \
            -destination "platform=iOS Simulator,name=iPhone 16,OS=latest" \
            -only-testing:BingekiTests \
            -resultBundlePath test-results-unit.xcresult

      - name: Run UI Tests
        run: |
          xcodebuild test \
            -project Bingeki.xcodeproj \
            -scheme Bingeki \
            -destination "platform=iOS Simulator,name=iPhone 16,OS=latest" \
            -only-testing:BingekiUITests \
            -resultBundlePath test-results-ui.xcresult

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: |
            Bingeki-iOS/test-results-unit.xcresult
            Bingeki-iOS/test-results-ui.xcresult

  ios-release-build:
    name: iOS Release Validation
    runs-on: macos-15
    defaults:
      run:
        working-directory: Bingeki-iOS
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &>/dev/null; then
            brew install xcodegen
          fi

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build in Release Configuration
        run: |
          xcodebuild build \
            -project Bingeki.xcodeproj \
            -scheme Bingeki \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify Archive Creation
        run: |
          xcodebuild archive \
            -project Bingeki.xcodeproj \
            -scheme Bingeki \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "build/Bingeki.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
          test -d "build/Bingeki.xcarchive"
