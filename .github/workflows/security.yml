name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 0'
  workflow_call:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm audit --audit-level=high
      - run: npm audit --prefix functions --audit-level=high

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Select scan range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            echo "base=$PR_BASE" >> "$GITHUB_OUTPUT"
            echo "head=$PR_HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "head=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && [ "$BEFORE" != "$GITHUB_SHA" ]; then
              echo "base=$BEFORE" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Scan secrets (full history when no base)
        uses: trufflesecurity/trufflehog@31d730383da3a2a71735410240ab9416f8f0eb54
        with:
          path: ./
          base: ${{ steps.range.outputs.base }}
          head: ${{ steps.range.outputs.head }}
          extra_args: --only-verified
