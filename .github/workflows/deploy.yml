name: Deploy to Firebase Hosting


on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
        run: npm run build

      - name: Install Functions Dependencies
        run: cd functions && npm ci

      - name: Deploy Firebase Rules, Indexes & Functions
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only firestore:rules,firestore:indexes,storage,functions
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BINGEKI }}

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT_BINGEKI: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BINGEKI }}
        run: |
          # Auth via service account
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_BINGEKI" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"

          # Deploy, capturing output so we can detect the flaky retry false-negative
          set +e
          out=$(npx -y firebase-tools@latest deploy --only hosting --project bingeki --non-interactive 2>&1)
          code=$?
          set -e
          echo "$out"

          if [ "$code" -ne 0 ]; then
            # Network "premature close" makes the CLI retry; the first attempt already
            # published, so the retry returns 400 "current active version". Not a real failure.
            if echo "$out" | grep -q "is the current active version"; then
              echo "::warning::Hosting already at the deployed version (retry false-negative) — treating as success."
              exit 0
            fi
            echo "::error::Firebase Hosting deploy failed."
            exit "$code"
          fi
