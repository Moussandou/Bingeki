name: Deploy to Firebase Hosting


on:
  push:
    branches:
      - main

jobs:
  validation:
    uses: ./.github/workflows/ci.yml

  security:
    uses: ./.github/workflows/security.yml

  build_and_deploy:
    needs: [validation, security]
    concurrency:
      group: firebase-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
        run: npm run build

      - name: Install Functions Dependencies
        run: cd functions && npm ci

      - name: Reject stale production revisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$current_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Refusing to deploy a revision superseded on main."
            exit 1
          fi

      - name: Deploy Firebase Rules, Indexes, Functions & Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT_BINGEKI: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BINGEKI }}
        run: |
          umask 077
          credentials=$(mktemp "$RUNNER_TEMP/firebase-sa.XXXXXX")
          trap 'rm -f "$credentials"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_BINGEKI" > "$credentials"
          export GOOGLE_APPLICATION_CREDENTIALS="$credentials"
          npx --yes --package=firebase-tools@15.34.0 -- firebase deploy \
            --only firestore:rules,firestore:indexes,storage,functions,hosting \
            --project bingeki --non-interactive
