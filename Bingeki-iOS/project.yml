name: Bingeki
options:
  bundleIdPrefix: com.bingeki
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

packages:
  # Same "bingeki" Firebase project as the web app (Firestore/Auth/Storage
  # are shared across every app registered in a project) — §8 of the
  # handoff doc.
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.4.0

targets:
  Bingeki:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core
      - path: Models
      - path: Features
      - path: Resources
      - path: "Preview Content"
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSUserTrackingUsageDescription: "Bingeki n'utilise pas le suivi publicitaire."
        # Outfit (display/CTA) + Inter (body) — OFL-licensed, instantiated as
        # static weights from Google Fonts' variable sources. See BKFont.swift.
        UIAppFonts:
          - Outfit-SemiBold.ttf
          - Outfit-Bold.ttf
          - Outfit-ExtraBold.ttf
          - Outfit-Black.ttf
          - Inter-Regular.ttf
          - Inter-Medium.ttf
          - Inter-SemiBold.ttf
          - Inter-Bold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bingeki.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_ASSET_PATHS: "\"Preview Content\""
        ENABLE_PREVIEWS: YES
        CODE_SIGN_ENTITLEMENTS: Resources/Bingeki.entitlements
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseMessaging
    scheme:
      testTargets:
        - BingekiTests
      commandLineArguments:
        "-BG_MOCK_DATA": true
  BingekiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BingekiTests
    dependencies:
      - target: Bingeki
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
